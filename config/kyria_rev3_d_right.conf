# LL connection-timing renegotiation (BT 4.1 CPR) collided with macOS sleep
CONFIG_BT_CTLR_CONN_PARAM_REQ=n

# Trackpoint requires interrupt-driven uart driver, instead of the default async
CONFIG_UART_INTERRUPT_DRIVEN=y

# Unicode with no delays: the whole hex sequence is sent in one go, so keys
# rolled in right after a Polish letter can't land in the middle of it
# (they would, since home-row taps fire on release with the next key queued).
CONFIG_ZMK_UNICODE_TAP_MS=0
# One letter is ~10 reports sent at once; leave room for a few in a row.
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=60
